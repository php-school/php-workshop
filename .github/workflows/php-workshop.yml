name: PhpWorkshop

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: php-cs-fixer,composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer update --prefer-dist
        env:
          # league/commonmark 1 has security advisories; remove once on commonmark 2
          COMPOSER_NO_SECURITY_BLOCKING: 1

      - name: Run phpunit tests
        run: vendor/bin/phpunit --stop-on-error

      - name: Run phpcs
        run: composer cs

      - name: Run phpstan
        run: composer static

      - name: Coverage upload
        if: matrix.php == '7.4'
        run: bash <(curl -s https://codecov.io/bash)

