name: PhpWorkshop

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.0, 8.1, 8.2, 8.3]

    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: php-cs-fixer:3.95.27,composer:v2
          coverage: none

      - name: Install Dependencies
        # PHPStan 1.11+ reports new errors; keep 1.10 until the PHPStan 2 upgrade
        run: composer update --prefer-dist --with phpstan/phpstan:~1.10.67
        env:
          # league/commonmark 1 has security advisories; remove once on commonmark 2
          COMPOSER_NO_SECURITY_BLOCKING: 1

      - name: Run phpunit tests
        run: |
          mkdir -p build/logs
          vendor/bin/phpunit --coverage-clover ./build/logs/clover.xml

      - name: Run phpcs
        run: composer cs

      - name: Run phpstan
        run: composer static

      - name: Coverage upload
        if: matrix.php == '7.4'
        run: bash <(curl -s https://codecov.io/bash)

